server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html sin cache explicito: el navegador podia cachearlo por
    # heuristica (sin Cache-Control ni Expires) y quedarse referenciando un
    # bundle JS/CSS con hash viejo que ya no existe tras el proximo deploy --
    # asi paso el 2026-08-25 (subida de factura sin feedback visible porque
    # el navegador seguia corriendo el JS de antes de las mejoras de UX).
    # no-cache = siempre revalida con el servidor (200/304), no evita cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
